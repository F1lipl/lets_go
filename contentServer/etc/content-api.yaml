Name: content-api
Host: 0.0.0.0
Port: 8889

Log:
  ServiceName: content-api
  Mode: file
  Encoding: json
  Path: logs
  Level: info
  Stat: true
  KeepDays: 14
  Compress: true
  Rotation: daily
  FieldKeys:
    TraceKey: trace_id
    SpanKey: span_id

Telemetry:
  Name: content-api
  Endpoint: 127.0.0.1:4317
  Sampler: 1.0
  Batcher: otlpgrpc

DataSource: "${CONTENT_DB_DSN}"

Auth:
  AccessSecret: "${CONTENT_ACCESS_SECRET}"
